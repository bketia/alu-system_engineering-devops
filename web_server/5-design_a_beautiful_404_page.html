<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Lost in Space | bezastudio.tech</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "Trebuchet MS", Arial, sans-serif;
      color: #f5f3ff;
      background: radial-gradient(circle at 30% 20%, #3b2a6b 0%, #120c2b 55%, #05030f 100%);
    }
    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle { 50% { opacity: 0.2; } }
    .scene { position: relative; text-align: center; padding: 20px; }
    .planet {
      width: 150px;
      height: 150px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #ffb36b, #e2572c 70%);
      box-shadow: 0 0 60px rgba(255, 140, 80, 0.45);
      position: relative;
      animation: float 6s infinite ease-in-out;
    }
    .planet::after {
      content: "";
      position: absolute;
      top: 60px;
      left: -40px;
      width: 230px;
      height: 30px;
      border: 4px solid rgba(255, 220, 180, 0.7);
      border-radius: 50%;
      transform: rotate(-15deg);
    }
    @keyframes float { 50% { transform: translateY(-14px); } }
    .code {
      font-size: 7rem;
      font-weight: 900;
      letter-spacing: 8px;
      color: #ffb36b;
      text-shadow: 0 0 25px rgba(255, 179, 107, 0.6);
    }
    .tagline { font-size: 1.6rem; margin: 10px 0 8px; font-style: italic; }
    .message { max-width: 460px; margin: 0 auto 26px; color: #c4b5fd; line-height: 1.6; }
    .home {
      display: inline-block;
      padding: 12px 30px;
      border-radius: 30px;
      color: #120c2b;
      background: #ffb36b;
      font-weight: bold;
      text-decoration: none;
      transition: transform 0.2s;
    }
    .home:hover { transform: scale(1.08); }
    .brand { margin-top: 22px; font-size: 0.85rem; color: #8b7fc7; letter-spacing: 2px; }
  </style>
</head>
<body>
  <span class="star" style="top:10%;left:15%"></span>
  <span class="star" style="top:25%;left:80%;animation-delay:1s"></span>
  <span class="star" style="top:70%;left:10%;animation-delay:2s"></span>
  <span class="star" style="top:85%;left:65%;animation-delay:0.5s"></span>
  <span class="star" style="top:40%;left:92%;animation-delay:1.5s"></span>
  <span class="star" style="top:15%;left:55%;animation-delay:2.5s"></span>
  <main class="scene">
    <div class="planet"></div>
    <div class="code">404</div>
    <p class="tagline">Ceci n'est pas une page</p>
    <p class="message">
      You drifted past the edge of this website. The page you are looking
      for has floated off into deep space, or it never existed at all.
    </p>
    <a class="home" href="http://bezastudio.tech/">Beam me back home</a>
    <p class="brand">BEZASTUDIO.TECH</p>
  </main>
</body>
</html>
